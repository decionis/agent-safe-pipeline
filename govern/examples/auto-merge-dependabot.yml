# A dependency update merges itself only when Decionis allows it: the update's
# kind and size are the intent's parameters, and the merge is the verdict's
# consequence rather than a bot's default.
name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  govern:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read the update
        id: metadata
        uses: dependabot/fetch-metadata@v2

      - name: Decide
        id: gate
        uses: decionis/govern@v2
        with:
          api-key: ${{ secrets.DECIONIS_API_KEY }}
          tenant-id: ${{ vars.DECIONIS_TENANT_ID }}
          action: dependency-merge
          resource: pr:${{ github.event.pull_request.number }}
          comment: "true"
          payload: |
            {
              "dependency": "${{ steps.metadata.outputs.dependency-names }}",
              "update_type": "${{ steps.metadata.outputs.update-type }}",
              "ecosystem": "${{ steps.metadata.outputs.package-ecosystem }}"
            }
          # The merge is the gated command: it does not run on a BLOCK.
          run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
