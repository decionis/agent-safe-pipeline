# terraform apply runs through the gate with the plan's own numbers as the
# intent's parameters, so policy decides on the blast radius Terraform
# reported and the dossier records it.
name: Terraform apply

on:
  push:
    branches: [main]
    paths: ["infra/**"]

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3

      - name: Plan
        id: plan
        run: |
          terraform init -input=false
          terraform plan -input=false -out=tfplan
          terraform show -json tfplan > plan.json
          jq -c '{
            add: [.resource_changes[]? | select(.change.actions | index("create"))] | length,
            change: [.resource_changes[]? | select(.change.actions | index("update"))] | length,
            destroy: [.resource_changes[]? | select(.change.actions | index("delete"))] | length,
            touches_iam: ([.resource_changes[]? | select(.type | test("iam|security_group"))] | length) > 0
          }' plan.json > summary.json
          echo "summary=$(cat summary.json)" >> "$GITHUB_OUTPUT"

      - name: Govern the apply
        uses: decionis/govern@v2
        with:
          api-key: ${{ secrets.DECIONIS_API_KEY }}
          tenant-id: ${{ vars.DECIONIS_TENANT_ID }}
          action: terraform-apply
          resource: infra:tfplan
          environment: production
          payload: ${{ steps.plan.outputs.summary }}
          # An ESCALATE holds the step while Decionis orchestrates the approval.
          escalation: managed
          approver-role: PLATFORM_LEAD
          run: cd infra && terraform apply -input=false tfplan
