# A tagged release ships only on an ALLOW. The publish command runs through
# the gate; a BLOCK never publishes; an ESCALATE waits for the release
# manager's approval, orchestrated by Decionis, within the intent's lifetime.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Govern the release
        uses: decionis/govern@v2
        with:
          api-key: ${{ secrets.DECIONIS_API_KEY }}
          tenant-id: ${{ vars.DECIONIS_TENANT_ID }}
          action: release-publish
          resource: npm:${{ github.event.repository.name }}
          payload: |
            { "tag": "${{ github.ref_name }}", "sha": "${{ github.sha }}", "actor": "${{ github.actor }}" }
          escalation: managed
          approver-role: RELEASE_MANAGER
          run: npm publish --provenance --access public
