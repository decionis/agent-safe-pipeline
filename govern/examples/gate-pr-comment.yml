# Shadow: nothing is enforced and no build fails for the gate's sake. Every
# pull request gets the verdict Decionis would have given, as a comment that
# updates in place, so a team sees what governing would do before it does.
name: Decionis shadow

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: What would Decionis say?
        uses: decionis/govern@v2
        with:
          api-key: ${{ secrets.DECIONIS_API_KEY }}
          tenant-id: ${{ vars.DECIONIS_TENANT_ID }}
          mode: shadow
          action: pull-request-change
          resource: pr:${{ github.event.pull_request.number }}
          payload: |
            {
              "title": ${{ toJSON(github.event.pull_request.title) }},
              "author": "${{ github.event.pull_request.user.login }}",
              "changed_files": ${{ github.event.pull_request.changed_files }},
              "base": "${{ github.base_ref }}"
            }
          comment: "true"
