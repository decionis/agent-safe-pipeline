# GitLab CI: the same gate as one job. The verdict and the record's ids reach
# later jobs as variables through the dotenv report, and the merge request
# gets the comment when GOVERN_GITLAB_TOKEN (a project token with `api`) is set.
stages: [deploy]

deploy:production:
  stage: deploy
  image: alpine:3
  before_script:
    - apk add --no-cache curl tar
  environment: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    # DECIONIS_API_KEY and DECIONIS_TENANT_ID come from the project's CI variables (masked).
    GOVERN_ACTION: production-deploy
    GOVERN_RESOURCE: service:api
    GOVERN_ENVIRONMENT: production
    GOVERN_OUTPUT_FILE: govern.env
    GOVERN_COMMENT: "true"
    # The image has no bash; the gated command runs through sh.
    GOVERN_SHELL: sh
  script:
    # The release's binary for this platform, verified against the release's
    # SHA256SUMS before it is installed; GOVERN_VERSION pins the version.
    - curl -fsSL https://raw.githubusercontent.com/decionis/agent-safe-pipeline/master/govern/install.sh | GOVERN_VERSION=2.1.0 GOVERN_INSTALL_PREFIX="$CI_PROJECT_DIR/.govern" sh
    - export PATH="$CI_PROJECT_DIR/.govern/bin:$PATH"
    - govern run --payload "{\"service\":\"api\",\"sha\":\"$CI_COMMIT_SHA\"}" -- ./scripts/deploy.sh
  artifacts:
    reports:
      dotenv: govern.env

announce:
  stage: .post
  image: alpine:3
  needs: [deploy:production]
  script:
    - echo "decision=$GOVERN_DECISION dossier=$GOVERN_DOSSIER_ID outcome=$GOVERN_OUTCOME"
