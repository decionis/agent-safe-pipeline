# A production deploy that cannot run without Decionis authorizing it: the
# deploy script runs through the gate, so an ALLOW is a claimed grant and a
# BLOCK is a step that fails with the command never started. What happened is
# finalized with Decionis afterwards and joins the signed Decision Dossier.
name: Deploy to production

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Govern the deploy
        id: gate
        uses: decionis/govern@v2
        with:
          api-key: ${{ secrets.DECIONIS_API_KEY }}
          tenant-id: ${{ vars.DECIONIS_TENANT_ID }}
          action: production-deploy
          resource: service:api
          environment: production
          payload: |
            {
              "service": "api",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "actor": "${{ github.actor }}"
            }
          run: ./scripts/deploy.sh # runs only on an ALLOW whose grant this step claimed

      - name: Record the proof
        if: always()
        run: |
          echo "decision=${{ steps.gate.outputs.decision }} dossier=${{ steps.gate.outputs.dossier-id }} outcome=${{ steps.gate.outputs.outcome }}"
