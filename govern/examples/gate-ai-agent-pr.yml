# A pull request an AI agent opened is decided before it merges. The gate is
# advisory here (no wrapped command), so the verdict is an output the merge
# step reads; wrapping the merge command instead makes it enforced.
name: Govern agent-authored pull requests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  govern:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Detect an agent author
        id: detect
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          agent=false
          case "$AUTHOR" in *"[bot]"*|*claude*|*copilot*|*cursor*|*codex*|*openhands*) agent=true ;; esac
          case "$BODY" in *"Generated with"*|*"Co-Authored-By: Claude"*|*"Co-authored-by: Copilot"*) agent=true ;; esac
          echo "ai_generated=$agent" >> "$GITHUB_OUTPUT"

      - name: Decide
        id: gate
        uses: decionis/govern@v2
        with:
          api-key: ${{ secrets.DECIONIS_API_KEY }}
          tenant-id: ${{ vars.DECIONIS_TENANT_ID }}
          action: agent-pull-request
          resource: pr:${{ github.event.pull_request.number }}
          fail-on: never
          comment: "true"
          payload: |
            {
              "author": "${{ github.event.pull_request.user.login }}",
              "agent_generated": ${{ steps.detect.outputs.ai_generated }},
              "changed_files": ${{ github.event.pull_request.changed_files }},
              "additions": ${{ github.event.pull_request.additions }},
              "deletions": ${{ github.event.pull_request.deletions }}
            }

      - name: Merge when allowed
        if: steps.gate.outputs.decision == 'ALLOW' && steps.detect.outputs.ai_generated == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
