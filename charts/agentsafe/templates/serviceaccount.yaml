{{- if .Values.serviceAccount.create }}
# The gateway's identity, with no token mounted and no bindings: it calls no
# Kubernetes API, and least privilege here is none.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentsafe.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentsafe.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
