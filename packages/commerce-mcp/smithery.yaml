# Public npm-backed Smithery manifest for @decionis/commerce@0.1.4.
# The stable version is pinned so installations cannot drift across releases.
# The server starts without credentials for capability discovery. ERP guard calls
# require owned access. Unconfigured local STDIO provisions provisional Shadow
# access on its first valid evaluation and persists it in a private AgentOps directory.
# Calls fail closed on invalid access; errors never create replacement identities.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        description: Existing workspace key; omit for provisional local Shadow first-use access.
      orgId:
        type: string
        description: Organization UUID that binds Protocol evaluation and evidence calls.
      apiBase:
        type: string
        description: Optional HTTPS API origin or exact /aws gateway prefix; defaults to https://api.decionis.com.
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "@decionis/commerce@0.1.4"],
      env: {
        ...(config.apiKey ? { DECIONIS_API_KEY: config.apiKey } : {}),
        ...(config.orgId ? { DECIONIS_ORG_ID: config.orgId } : {}),
        ...(config.apiBase ? { DECIONIS_API_BASE: config.apiBase } : {})
      }
    })
