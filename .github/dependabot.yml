version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 10
    # update-types applies only to scheduled version updates; security updates remain enabled.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 10
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: docker
    directory: "/packages/agentsafe"
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5

  # The verifying provider for Envoy is a Go module with one dependency, the
  # RFC 8785 canonicaliser, and the Kong plugin is a second module that imports
  # it and Kong's plugin development kit; their go.sum files pin them.
  - package-ecosystem: gomod
    directories:
      - "/verifiers/envoy"
      - "/verifiers/kong"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5

  # The verifying provider for Spring is a Maven module; its pom pins its
  # dependencies.
  - package-ecosystem: maven
    directory: "/verifiers/spring"
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5

  # The verifying provider in Rust is a library crate; its manifest names the
  # dependencies, and the consumer's lockfile pins them.
  - package-ecosystem: cargo
    directory: "/verifiers/rust"
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5

  # The verifying provider for .NET; its project files pin the packages.
  - package-ecosystem: nuget
    directory: "/verifiers/dotnet"
    schedule:
      interval: weekly
      day: monday
      time: "07:45"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
