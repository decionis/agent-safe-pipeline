version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 10
    # update-types applies only to scheduled version updates; security updates remain enabled.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 10
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: docker
    directory: "/packages/agentsafe"
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5

  # The verifying provider for Envoy is a Go module with one dependency, the
  # RFC 8785 canonicaliser; its go.sum pins it.
  - package-ecosystem: gomod
    directory: "/verifiers/envoy"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5

  # The verifying provider for Spring is a Maven module; its pom pins its
  # dependencies.
  - package-ecosystem: maven
    directory: "/verifiers/spring"
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/Stockholm
    open-pull-requests-limit: 5
