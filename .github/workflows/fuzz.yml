name: Property fuzzing

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "19 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-safe-fuzz-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: Property fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.3
          run_install: false
          standalone: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run bounded deterministic fuzzing
        env:
          FUZZ_REPORT_PATH: artifacts/fuzz/fast-check-failure.txt
          FUZZ_RUNS: ${{ github.event_name == 'schedule' && '5000' || '1000' }}
        run: pnpm fuzz
      - name: Retain minimized failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-check-failure
          path: artifacts/fuzz/fast-check-failure.txt
          if-no-files-found: ignore
          retention-days: 30
