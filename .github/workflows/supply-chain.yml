name: Supply chain

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review production dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          allow-licenses: 0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT, BlueOak-1.0.0, CC0-1.0, Python-2.0
          # jakarta.servlet-api is the compile-time servlet API of verifiers/spring, provided
          # scope: the application's container supplies it and nothing under it ships with the
          # module; Jakarta's EPL-2.0 / GPL-2.0-with-Classpath-exception dual licence is why it
          # is named here rather than in the allow list. google.golang.org/protobuf, an indirect
          # dependency of Kong's plugin development kit in verifiers/kong, is BSD-3-Clause with
          # Google's Go patent grant, the PATENTS file Go itself ships under: a grant of rights
          # the review reads as an unknown licence, not a restriction.
          # bowser 2.14.1 ships unmodified under MIT / MITNFA; retain its LICENSE.
          # The version-specific review is recorded in license-policy.json.
          allow-dependencies-licenses: pkg:npm/bowser@2.14.1, pkg:npm/caniuse-lite, pkg:npm/node-forge, pkg:npm/type-fest, pkg:maven/jakarta.servlet/jakarta.servlet-api, pkg:golang/google.golang.org/protobuf
          fail-on-severity: low
          fail-on-scopes: runtime
      - name: Review toolchain dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          allow-licenses: 0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT, BlueOak-1.0.0, CC0-1.0, Python-2.0
          # jakarta.servlet-api is the compile-time servlet API of verifiers/spring, provided
          # scope: the application's container supplies it and nothing under it ships with the
          # module; Jakarta's EPL-2.0 / GPL-2.0-with-Classpath-exception dual licence is why it
          # is named here rather than in the allow list. google.golang.org/protobuf, an indirect
          # dependency of Kong's plugin development kit in verifiers/kong, is BSD-3-Clause with
          # Google's Go patent grant, the PATENTS file Go itself ships under: a grant of rights
          # the review reads as an unknown licence, not a restriction.
          # bowser 2.14.1 ships unmodified under MIT / MITNFA; retain its LICENSE.
          # The version-specific review is recorded in license-policy.json.
          allow-dependencies-licenses: pkg:npm/bowser@2.14.1, pkg:npm/caniuse-lite, pkg:npm/node-forge, pkg:npm/type-fest, pkg:maven/jakarta.servlet/jakarta.servlet-api, pkg:golang/google.golang.org/protobuf
          fail-on-severity: moderate
          fail-on-scopes: development

  audit:
    name: Dependency and license audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.3
          run_install: false
          standalone: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit production dependencies
        run: pnpm security:production
      - name: Audit build toolchain
        run: pnpm security:toolchain
      - name: Check dependency licenses
        run: pnpm license:check
      - name: Generate dependency-license inventories
        run: pnpm license:inventory
      - name: Upload dependency-license inventories
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-license-inventories
          path: artifacts/dependency-licenses/
          if-no-files-found: error
          retention-days: 30
