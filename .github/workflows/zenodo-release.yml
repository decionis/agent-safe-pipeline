name: Verify Zenodo release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Released semantic version to verify (without the v prefix)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zenodo-release-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.3
          run_install: false
          standalone: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate release metadata sources
        run: pnpm metadata:check
      - name: Verify public Zenodo record and DOI resolution
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release_version="${RELEASE_VERSION#v}"
          node scripts/VerifyZenodoRelease.mjs \
            --version "$release_version" \
            --attempts 20 \
            --delay-ms 10000 \
            --request-timeout-ms 5000 \
            --output zenodo-release-evidence.json
      - name: Show verification evidence
        run: node -e "process.stdout.write(require('node:fs').readFileSync('zenodo-release-evidence.json'))"
      - name: Retain verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zenodo-release-evidence-${{ github.event.release.tag_name || inputs.version }}
          path: zenodo-release-evidence.json
          if-no-files-found: error
          retention-days: 90
