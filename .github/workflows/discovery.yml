name: Discovery

# Validates this repo's llms.txt and the links inside it. The weekly run matters
# as much as the push run: discovery links rot without anyone touching the repo.

on:
  push:
    branches: [master]
    paths:
      - "llms.txt"
      - "llms-full.txt"
      - ".github/workflows/discovery.yml"
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
      - name: Validate discovery assets and links
        run: node scripts/CheckDiscovery.mjs --check-links
