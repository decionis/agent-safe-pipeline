name: Validate CommerceGate Claude Desktop bundle

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/commerce-mcp-mcpb.yml"
      - "packages/commerce-mcp/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcpb:
    name: MCPB — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Decionis Action Gate (shadow)
        continue-on-error: true
        uses: decionis/govern@6bc8bd3fc0dab105703fe3dc8c6c7a1d738bcf29 # v1
        with:
          api-key: ${{ secrets.DECIONIS_API_KEY }}
          org-id: ${{ secrets.DECIONIS_ORG_ID }}
          workflow-key: github_deploy_approval
          action: validate-commercegate-claude-desktop-bundle
          mode: shadow
          payload: |
            {
              "artifact": "@decionis/commerce",
              "platform": "${{ matrix.os }}",
              "sha": "${{ github.event.pull_request.head.sha || github.sha }}",
              "actor": "${{ github.actor }}"
            }

      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.3
          run_install: false
          standalone: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build CommerceGate MCP
        run: pnpm --filter @decionis/commerce build

      - name: Install pinned MCPB CLI
        run: npm install --prefix "${{ runner.temp }}/commerce-mcpb-cli" @anthropic-ai/mcpb@2.1.2 --ignore-scripts --no-audit --no-fund

      - name: Validate, pack, unpack, and smoke test MCPB
        env:
          MCPB_CLI_PATH: ${{ runner.temp }}/commerce-mcpb-cli/node_modules/@anthropic-ai/mcpb/dist/cli/cli.js
        run: node packages/commerce-mcp/scripts/VerifyMcpb.mjs
