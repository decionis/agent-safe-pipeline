name: Validate CommerceGate Claude Desktop extension

on:
  pull_request:
    branches: [master]
    paths:
      - ".gitattributes"
      - ".github/workflows/commerce-mcp-mcpb.yml"
      - "NOTICE"
      - "packages/commerce-mcp/**"
      - "packages/commerce-mcp-claude-extension/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcpb:
    name: MCPB — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Decionis Action Gate (shadow)
        continue-on-error: true
        uses: decionis/govern@6bc8bd3fc0dab105703fe3dc8c6c7a1d738bcf29 # v1
        with:
          api-key: ${{ secrets.DECIONIS_API_KEY }}
          org-id: ${{ secrets.DECIONIS_ORG_ID }}
          workflow-key: github_deploy_approval
          action: validate-commercegate-claude-desktop-bundle
          mode: shadow
          payload: |
            {
              "artifact": "@decionis/commercegate-claude-extension",
              "platform": "${{ matrix.os }}",
              "sha": "${{ github.event.pull_request.head.sha || github.sha }}",
              "actor": "${{ github.actor }}"
            }

      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.3
          run_install: false
          standalone: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build CommerceGate MCP
        run: pnpm --filter @decionis/commerce build

      - name: Build and test MIT extension wrapper
        run: pnpm --filter @decionis/commercegate-claude-extension build && pnpm --filter @decionis/commercegate-claude-extension test

      - name: Validate, pack, unpack, and smoke test MCPB
        env:
          MCPB_CLI_PATH: packages/commerce-mcp-claude-extension/node_modules/@anthropic-ai/mcpb/dist/cli/cli.js
        run: node packages/commerce-mcp-claude-extension/scripts/VerifyMcpb.mjs --output "${{ runner.temp }}/decionis-commercegate.mcpb"

      - name: Upload deterministic MCPB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commercegate-mcpb-${{ matrix.os }}
          path: ${{ runner.temp }}/decionis-commercegate.mcpb
          if-no-files-found: error
          retention-days: 1

  reproducibility:
    name: MCPB — cross-platform reproducibility
    needs: mcpb
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Download platform bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: commercegate-mcpb-*
          path: artifacts

      - name: Compare macOS and Windows bytes
        run: |
          cmp \
            artifacts/commercegate-mcpb-macos-latest/decionis-commercegate.mcpb \
            artifacts/commercegate-mcpb-windows-latest/decionis-commercegate.mcpb
          sha256sum artifacts/commercegate-mcpb-*/decionis-commercegate.mcpb
