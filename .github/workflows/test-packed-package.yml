name: "Test packed package"

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packed-package-matrix:
    name: "Node ${{ matrix.node }} — packed tarball"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22.14.0", "22"]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.3
          run_install: false
          standalone: true
      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies (lifecycle scripts disabled)
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build package
        run: pnpm --filter @decionis/agent-safe-pipeline build
      - name: Pack tarball
        run: |
          cd packages/pipeline
          pnpm pack --pack-destination /tmp/tarball
          echo "TARBALL_PATH=$(ls /tmp/tarball/*.tgz)" >> "$GITHUB_ENV"
        working-directory: ${{ github.workspace }}
      # The consumer is assembled, not installed: the tarball's own files
      # unpacked as the package it imports, and the package's dependencies,
      # with the two the harness imports itself, linked from the tree the
      # lockfile pins and the install above put in place. No package manager
      # runs and nothing is fetched, so what the consumer imports is exactly
      # what the tarball ships against the versions the tests ran with.
      - name: Assemble a consumer of the tarball from the pinned tree
        run: |
          mkdir -p /tmp/consumer
          cp tests/integration/npm-pack/consumer.mjs /tmp/consumer/
          printf '%s\n' '{ "name": "consumer-test", "private": true, "type": "module" }' > /tmp/consumer/package.json
          node scripts/ConsumerFromTarball.mjs "$TARBALL_PATH" packages/pipeline /tmp/consumer zod @decionis/presence-node
      - name: Verify the consumer holds the tarball's files and nothing else
        working-directory: /tmp/consumer/node_modules/@decionis/agent-safe-pipeline
        run: |
          tar --list --gzip --file "$TARBALL_PATH" | sed 's#^package/##' | grep -v '/$' | sort > /tmp/shipped.txt
          find . -type f | sed 's#^\./##' | sort > /tmp/held.txt
          diff /tmp/shipped.txt /tmp/held.txt
          echo "the consumer imports the $(wc -l < /tmp/held.txt | tr -d ' ') files the tarball ships"
      - name: Run consumer validation (ALLOW + BLOCK)
        working-directory: /tmp/consumer
        run: node consumer.mjs
      - name: Copy the wire-contract harness into the consumer
        run: |
          mkdir -p /tmp/consumer/contract
          cp tests/integration/contract/*.mjs /tmp/consumer/contract/
      - name: Run the wire-contract harness against the packed tarball
        working-directory: /tmp/consumer
        env:
          CONTRACT_DIAGNOSTICS_DIR: /tmp/consumer/diagnostics
        run: node --test --test-concurrency=1 contract/Contract.test.mjs
      - name: Upload contract diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-diagnostics-node-${{ matrix.node }}
          path: /tmp/consumer/diagnostics
          if-no-files-found: ignore
          retention-days: 7
