name: Record branch creation

on:
  create:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: >-
      github.event.ref_type == 'branch' &&
      github.actor == 'ocularminds' &&
      vars.PR_BOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the trusted PR bot
        env:
          BRANCH_NAME: ${{ github.event.ref }}
          CREATION_RUN_ID: ${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run PullRequestBot.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            --field branch="$BRANCH_NAME" \
            --field creation_run_id="$CREATION_RUN_ID"
