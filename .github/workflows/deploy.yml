name: Continuous integration

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      release_dry_run:
        description: Build and verify release assets without publishing
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: agent-safe-ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.3
          run_install: false
          standalone: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify
        run: pnpm verify
      - name: Prove the self-checking demos
        run: pnpm examples:prove
      - name: Upload coverage report
        if: ${{ success() || hashFiles('packages/pipeline/coverage/**') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pipeline-coverage
          path: packages/pipeline/coverage/
          if-no-files-found: error
          retention-days: 14

  assurance:
    name: Mutation assurance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.3
          run_install: false
          standalone: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Mutation-test trust-boundary tests
        run: pnpm mutation

  image:
    name: Trusted executor image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the trusted executor image
        run: docker build -f packages/agentsafe/Dockerfile -t agentsafe:ci .
      - name: Refuse to start without configuration
        shell: bash
        run: |
          set -euo pipefail
          if output="$(docker run --rm agentsafe:ci 2>&1)"; then
            echo "The executor started with no configuration." >&2
            exit 1
          fi
          grep -q 'REFUSED_TO_START' <<<"$output"
      # The gateway in the production image: it answers its version, resolves
      # a configuration with a mounted key under the permission model, comes
      # up ready without ever contacting the authority, and fails closed on
      # the first consequential request when the authority cannot be reached.
      - name: Run the gateway in the image and watch it fail closed
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker run --rm agentsafe:ci version)" = "$(node -p "require('./packages/agentsafe/package.json').version")"
          secrets="$RUNNER_TEMP/agentsafe-gateway-secrets"
          mkdir -p "$secrets"
          printf 'synthetic-authority-key-ci\n' > "$secrets/decionis-api-key"
          sudo chown root:65532 "$secrets"/*
          sudo chmod 0440 "$secrets"/*
          common=(--read-only --user 65532:65532 --cap-drop ALL --security-opt no-new-privileges
            --network host
            -e AGENTSAFE_UPSTREAM=http://127.0.0.1:1
            -e AGENTSAFE_LISTEN=127.0.0.1:8089
            -e AGENTSAFE_MODE=enforcement
            -e DECIONIS_API_URL=https://authority.decionis.example
            -e DECIONIS_API_KEY_FILE=/var/run/agent-safe/secrets/decionis-api-key
            -e DECIONIS_TENANT_ID=00000000-0000-4000-8000-000000000001
            -e DECIONIS_TIMEOUT_MS=1000
            --mount "type=bind,src=$secrets,dst=/var/run/agent-safe/secrets,readonly")
          docker run --rm "${common[@]}" agentsafe:ci config --json | grep -q '"kind":"decionis"'
          container="$(docker run -d "${common[@]}" agentsafe:ci)"
          for _ in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8089/_agentsafe/readyz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fs http://127.0.0.1:8089/_agentsafe/readyz
          status="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8089/payments \
            -H 'content-type: application/json' -d '{"amount": 1}')"
          docker stop -t 10 "$container" >/dev/null
          logs="$(docker logs "$container" 2>&1)"
          docker rm "$container" >/dev/null
          test "$status" = "503"
          grep -q '"event":"GATEWAY_STARTED"' <<<"$logs"
          grep -q '"state":"AUTHORITY_UNAVAILABLE"' <<<"$logs"
          grep -q '"event":"GATEWAY_STOPPED"' <<<"$logs"
      # The posture the manifest declares, reproduced with docker: a non-root
      # user, a read-only root, no capabilities, no new privileges, secrets as
      # files owned by root and readable by the process's group only, a TLS
      # certificate for the listener, and a writable journal for the chain
      # heads. The executor must verify it, listen over TLS, and persist the
      # chain heads on a clean stop; run as root, or behind a proxy, it must
      # refuse and name the check.
      - name: Verify the declared posture and refuse a broken one
        shell: bash
        run: |
          set -euo pipefail
          secrets="$RUNNER_TEMP/agent-safe-secrets"
          mkdir -p "$secrets"
          printf 'synthetic-caller-token-ci\n' > "$secrets/caller-token"
          printf 'synthetic-authority-key-ci\n' > "$secrets/decionis-api-key"
          printf 'Bearer synthetic-downstream-credential-ci\n' > "$secrets/downstream-credential"
          # Who may call: one proposer, by the digest of a token nothing here
          # holds. The file carries digests and identities, never a token.
          digest="$(printf 'synthetic-caller-token-ci' | sha256sum | cut -d' ' -f1)"
          cat > "$secrets/principals.json" <<EOF
          {
            "version": "agent-safe.principals/1",
            "principals": [
              {
                "id": "synthetic-ci-workflow",
                "role": "PROPOSER",
                "tenant_id": "00000000-0000-4000-8000-000000000001",
                "actor": { "id": "synthetic-payout-agent", "type": "AI_AGENT" },
                "allowed_actions": ["forward_request"],
                "credential": { "kind": "BEARER", "token_sha256": "$digest" }
              }
            ]
          }
          EOF
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes \
            -keyout "$secrets/tls.key" -out "$secrets/tls.crt" -days 2 \
            -subj "/CN=agent-safe-executor" -addext "subjectAltName=DNS:agent-safe-executor" 2>/dev/null
          sudo chown root:65532 "$secrets"/*
          sudo chmod 0440 "$secrets"/*
          env_file="$RUNNER_TEMP/agent-safe.env"
          cat > "$env_file" <<'EOF'
          EXECUTOR_MODE=SHADOW
          EXECUTOR_BIND_ADDRESS=0.0.0.0
          PORT=8443
          EXECUTOR_TLS_CERT_FILE=/var/run/agent-safe/secrets/tls.crt
          EXECUTOR_TLS_KEY_FILE=/var/run/agent-safe/secrets/tls.key
          EXECUTOR_JOURNAL_DIR=/var/lib/agent-safe/journal
          EXECUTOR_HALT_FILE=/var/run/agent-safe/secrets/halted
          EXECUTOR_INTENT_TTL_SECONDS=300
          EXECUTOR_ESCALATION=NONE
          EXECUTOR_SECRETS_DIR=/var/run/agent-safe/secrets
          EXECUTOR_PRINCIPALS_FILE=/var/run/agent-safe/secrets/principals.json
          DECIONIS_API_URL=https://authority.decionis.example
          DECIONIS_API_KEY_FILE=/var/run/agent-safe/secrets/decionis-api-key
          DOWNSTREAM_URL=https://payouts.provider.example/v1/payouts
          DOWNSTREAM_SYSTEM=payout-rail
          DOWNSTREAM_OPERATION=create_payout
          DOWNSTREAM_ENVIRONMENT=production
          DOWNSTREAM_CREDENTIAL_FILE=/var/run/agent-safe/secrets/downstream-credential
          DOWNSTREAM_CREDENTIAL_HEADER=Authorization
          DOWNSTREAM_TIMEOUT_MS=5000
          EOF
          base=(--read-only --user 65532:65532 --cap-drop ALL --security-opt no-new-privileges
            --env-file "$env_file"
            --mount "type=bind,src=$secrets,dst=/var/run/agent-safe/secrets,readonly")
          hardened=("${base[@]}"
            --tmpfs "/var/lib/agent-safe:rw,noexec,nosuid,size=16m,uid=65532,gid=65532,mode=0700")

          container="$(docker run -d "${hardened[@]}" agentsafe:ci serve)"
          for _ in $(seq 1 30); do
            if docker logs "$container" 2>&1 | grep -q '"LISTENING"'; then break; fi
            sleep 1
          done
          # The chain heads are persisted, and reported, on the way down: the
          # logs are read after the stop so the checkpoint lines are in them.
          docker stop -t 10 "$container" >/dev/null
          status="$(docker wait "$container")"
          logs="$(docker logs "$container" 2>&1)"
          state="$(docker inspect --format '{{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}}' "$container")"
          docker rm "$container" >/dev/null
          echo "$logs"
          echo "container state: $state"
          grep -q '"POSTURE_VERIFIED"' <<<"$logs"
          grep -q '"LISTENING"' <<<"$logs"
          grep -q '"tls":true' <<<"$logs"
          grep -q '"CHAIN_CHECKPOINT"' <<<"$logs"
          grep -q '"PRINCIPALS_LOADED"' <<<"$logs"
          grep -q '"proposers":1' <<<"$logs"
          if grep -q 'synthetic-caller-token-ci' <<<"$logs"; then
            echo "A caller token reached the log." >&2
            exit 1
          fi
          if [[ "$status" != "0" ]]; then
            echo "The executor exited with status '$status' on SIGTERM." >&2
            exit 1
          fi

          # Each negative run must refuse for the reason it was broken for, and
          # say so; anything else, including a docker failure, prints what it
          # actually got rather than failing silently.
          refuses() {
            local expected="$1"
            shift
            local output
            if output="$("$@" 2>&1)"; then
              echo "The executor started when it should have refused ($expected):" >&2
              echo "$output" >&2
              return 1
            fi
            if ! grep -q "$expected" <<<"$output"; then
              echo "Expected $expected; the run said:" >&2
              echo "$output" >&2
              return 1
            fi
          }
          # The principals file another user could read is refused by name.
          sudo chmod 0444 "$secrets/principals.json"
          refuses POSTURE_PRINCIPALS_FILE_MODE docker run --rm "${hardened[@]}" agentsafe:ci serve
          sudo chmod 0440 "$secrets/principals.json"
          refuses POSTURE_ROOT_UID docker run --rm "${hardened[@]:1}" --user 0:0 agentsafe:ci serve
          refuses POSTURE_PROXY_ENV docker run --rm "${hardened[@]}" \
            -e HTTPS_PROXY=http://proxy.corp.example:3128 agentsafe:ci serve

          # The halt file stops the executor by existing: the process starts,
          # listens, and takes no work, saying which cause stopped it.
          printf 'stopped by the on-call operator\n' > "$secrets/halted"
          sudo chown root:65532 "$secrets/halted"
          sudo chmod 0440 "$secrets/halted"
          container="$(docker run -d "${hardened[@]}" agentsafe:ci serve)"
          for _ in $(seq 1 30); do
            if docker logs "$container" 2>&1 | grep -q '"LISTENING"'; then break; fi
            sleep 1
          done
          docker stop -t 10 "$container" >/dev/null
          docker wait "$container" >/dev/null
          logs="$(docker logs "$container" 2>&1)"
          docker rm "$container" >/dev/null
          echo "$logs"
          grep -q '"HALTED"' <<<"$logs"
          grep -q '"trigger":"HALT_FILE"' <<<"$logs"
          grep -q '"LISTENING"' <<<"$logs"
          rm "$secrets/halted"

          # The evidence chains continue across a restart: the same journal
          # directory, twice, and the second process resumes the head the
          # first one persisted rather than starting again from genesis.
          journal="$RUNNER_TEMP/agent-safe-journal"
          mkdir -p "$journal"
          sudo chown 65532:65532 "$journal"
          persistent=("${base[@]}" --mount "type=bind,src=$journal,dst=/var/lib/agent-safe")
          for attempt in 1 2; do
            container="$(docker run -d "${persistent[@]}" agentsafe:ci serve)"
            for _ in $(seq 1 30); do
              if docker logs "$container" 2>&1 | grep -q '"LISTENING"'; then break; fi
              sleep 1
            done
            docker stop -t 10 "$container" >/dev/null
            docker wait "$container" >/dev/null
            logs="$(docker logs "$container" 2>&1)"
            docker rm "$container" >/dev/null
            echo "$logs"
            if [[ "$attempt" == 2 ]]; then
              grep -q '"CHAIN_RESUMED"' <<<"$logs"
              grep -q '"chain":"agent-safe.security/1"' <<<"$logs"
            fi
          done

  distribution:
    name: Runtime ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            nfpm_arch: x86_64
            nfpm_sha256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
            package_arch: amd64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            nfpm_arch: arm64
            nfpm_sha256: 1c0f5f2999b9a974bfb04fdb0cc3306096de530ac5dbb25d739cc5f5219c919c
            package_arch: arm64
          - target: darwin-arm64
            runner: macos-15
          # Node has no single-executable support on x64 macOS; this target
          # ships the launcher layout, which the build script chooses itself.
          - target: darwin-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      NFPM_VERSION: 2.47.0
    steps:
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Not standalone: the standalone pnpm is itself a Node single executable,
      # which does not run on Intel macOS; the npm install uses the runner's Node.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.3
          run_install: false
          standalone: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      # The executable is built from the Node release packaging/sea/node.json
      # pins, downloaded and verified by the build itself, never from the
      # runner's Node; then archived, extracted again, and put through the
      # whole first-five-minutes path by the smoke test.
      - name: Build, archive and smoke-test the executable
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @decionis/agent-safe-pipeline build
          pnpm --filter @decionis/agentsafe build
          version="$(node -p "require('./packages/agentsafe/package.json').version")"
          node scripts/BuildExecutable.mjs --out release/sea --target "$TARGET"
          node scripts/ArchiveExecutable.mjs --executable release/sea/agentsafe --target "$TARGET" --out release
          extracted="$RUNNER_TEMP/extracted"
          mkdir -p "$extracted"
          tar -xzf "release/agentsafe-$version-$TARGET.tar.gz" -C "$extracted"
          packaging/smoke/Smoke.sh "$extracted/agentsafe-$version-$TARGET/agentsafe" "$version"
          cp release/sea/agentsafe.cjs "release/agentsafe-$version-$TARGET.bundle.cjs"
          rm -rf release/sea
      # The Linux packages, from the same executable, installed for real on
      # the runner and smoke-tested from /usr/bin before they are kept.
      - name: Build, install and smoke-test the Linux packages
        if: runner.os == 'Linux'
        env:
          TARGET: ${{ matrix.target }}
          NFPM_ARCH: ${{ matrix.nfpm_arch }}
          NFPM_SHA256: ${{ matrix.nfpm_sha256 }}
          PACKAGE_ARCH: ${{ matrix.package_arch }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/agentsafe/package.json').version")"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/nfpm.tgz" \
            "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_$NFPM_ARCH.tar.gz"
          echo "$NFPM_SHA256  $RUNNER_TEMP/nfpm.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/nfpm.tgz" -C "$RUNNER_TEMP" nfpm
          extracted="$RUNNER_TEMP/extracted/agentsafe-$version-$TARGET"
          mkdir -p packaging/linux/build
          cp "$extracted/agentsafe" packaging/linux/build/agentsafe
          for format in deb rpm; do
            VERSION="$version" ARCH="$PACKAGE_ARCH" \
              "$RUNNER_TEMP/nfpm" package -f packaging/linux/nfpm.yaml -p "$format" -t release
          done
          ls -l release/*.deb release/*.rpm
          sudo dpkg -i release/agentsafe_*.deb
          installed="$(command -v agentsafe || true)"
          [ "$installed" = /usr/bin/agentsafe ] || { echo "agentsafe resolves to '$installed', not /usr/bin/agentsafe" >&2; exit 1; }
          reported="$(agentsafe version || true)"
          [ "$reported" = "$version" ] || { echo "the installed agentsafe reports '$reported', not $version" >&2; exit 1; }
          # Readable as this unprivileged user, as they must be for the unit's dynamic user.
          for path in /usr/lib/systemd/system/agentsafe.service /etc/agentsafe/agentsafe.yaml.example /etc/agentsafe/environment.example; do
            [ -r "$path" ] || { echo "$path is not readable after install" >&2; ls -ld /etc/agentsafe >&2 || true; exit 1; }
          done
          systemd-analyze verify /usr/lib/systemd/system/agentsafe.service
          packaging/smoke/Smoke.sh /usr/bin/agentsafe "$version"
          sudo dpkg -r agentsafe
          if command -v rpm >/dev/null 2>&1; then rpm -qip release/agentsafe-*.rpm | grep -q '^Name *: agentsafe'; fi
      - name: Upload runtime artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-${{ matrix.target }}
          path: |
            release/agentsafe-*.tar.gz
            release/agentsafe-*.bundle.cjs
            release/*.deb
            release/*.rpm
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_dry_run)
    needs: [verify, assurance, image, distribution]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve release version
        id: release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workspace_version="$(node -p "require('./package.json').version")"
          package_version="$(node -p "require('./packages/pipeline/package.json').version")"
          package_name="$(node -p "require('./packages/pipeline/package.json').name")"

          if [[ "$workspace_version" != "$package_version" ]]; then
            echo "Workspace and package versions must match." >&2
            exit 1
          fi
          if [[ "$package_name" != "@decionis/agent-safe-pipeline" ]]; then
            echo "Unexpected release package: $package_name" >&2
            exit 1
          fi
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$package_version" =~ $semver ]]; then
            echo "Package version is not valid semantic versioning: $package_version" >&2
            exit 1
          fi

          release_tag="v${package_version}"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Release $release_tag already exists; nothing to create."
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$release_tag" >/dev/null 2>&1; then
            echo "Tag $release_tag exists without a GitHub release; refusing to reuse it." >&2
            exit 1
          fi

          {
            echo "exists=false"
            echo "package=$package_name"
            echo "version=$package_version"
            echo "tag=$release_tag"
            echo "stem=agent-safe-pipeline-$package_version"
            echo "tarball=decionis-agent-safe-pipeline-$package_version.tgz"
          } >> "$GITHUB_OUTPUT"
      - name: Install pnpm
        if: steps.release.outputs.exists != 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.3
          run_install: false
          standalone: true
      - name: Set up Node.js for release
        if: steps.release.outputs.exists != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify npm supports trusted publishing
        if: steps.release.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm_version="$(npm --version)"
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 5)) process.exit(1);
          ' "$npm_version"
      - name: Install checksum-verified gitsign
        if: steps.release.outputs.exists != 'true' && github.event_name == 'push'
        env:
          GITSIGN_VERSION: 0.17.1
          GITSIGN_SHA256: 69213a8a0813a151e5a47d0060862952ff833a845d57309dff76f7ba6600abae
        shell: bash
        run: |
          set -euo pipefail
          gitsign_path="$RUNNER_TEMP/gitsign"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$gitsign_path" \
            "https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/gitsign_${GITSIGN_VERSION}_linux_amd64"
          echo "$GITSIGN_SHA256  $gitsign_path" | sha256sum --check --strict
          chmod 0755 "$gitsign_path"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Create and verify keyless signed release tag
        if: steps.release.outputs.exists != 'true' && github.event_name == 'push'
        env:
          GITSIGN_TOKEN_PROVIDER: github-actions
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
          EXPECTED_IDENTITY: https://github.com/decionis/agent-safe-pipeline/.github/workflows/deploy.yml@refs/heads/master
          EXPECTED_ISSUER: https://token.actions.githubusercontent.com
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local gpg.format x509
          git config --local gpg.x509.program gitsign
          git tag --sign "$RELEASE_TAG" "$TARGET_SHA" --message "Release $RELEASE_TAG"

          tag_target="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [[ "$tag_target" != "$TARGET_SHA" ]]; then
            echo "Signed tag target $tag_target does not match release target $TARGET_SHA." >&2
            exit 1
          fi

          gitsign verify-tag \
            --certificate-identity "$EXPECTED_IDENTITY" \
            --certificate-oidc-issuer "$EXPECTED_ISSUER" \
            "$RELEASE_TAG"
      - name: Install dependencies without lifecycle scripts
        if: steps.release.outputs.exists != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build package, SBOM, and license inventories
        if: steps.release.outputs.exists != 'true'
        env:
          EXPECTED_NAME: ${{ steps.release.outputs.package }}
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_STEM: ${{ steps.release.outputs.stem }}
          RELEASE_TARBALL: ${{ steps.release.outputs.tarball }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release "$RUNNER_TEMP/packed" "$RUNNER_TEMP/consumer"
          pnpm --filter "$EXPECTED_NAME" build
          (
            cd packages/pipeline
            pnpm pack --pack-destination "$GITHUB_WORKSPACE/release"
          )
          test -s "release/$RELEASE_TARBALL"
          tar --extract --gzip --file "release/$RELEASE_TARBALL" --directory "$RUNNER_TEMP/packed"
          test "$(node -p "require('$RUNNER_TEMP/packed/package/package.json').name")" = "$EXPECTED_NAME"
          test "$(node -p "require('$RUNNER_TEMP/packed/package/package.json').version")" = "$EXPECTED_VERSION"
          test -s "$RUNNER_TEMP/packed/package/LICENSE"
          test -s "$RUNNER_TEMP/packed/package/NOTICE"

          (
            cd "$RUNNER_TEMP/packed/package"
            npm pkg delete devDependencies scripts
            npm install --ignore-scripts --omit=dev --no-audit --no-fund
            npm sbom --omit dev --sbom-format cyclonedx --sbom-type library \
              > "$GITHUB_WORKSPACE/release/$RELEASE_STEM.cdx.json"
          )
          node scripts/FinalizeReleaseSbom.mjs \
            "release/$RELEASE_STEM.cdx.json" "release/$RELEASE_TARBALL" \
            "$EXPECTED_NAME" "$EXPECTED_VERSION"
          node scripts/AssertReleaseSbom.mjs \
            "release/$RELEASE_STEM.cdx.json" "$EXPECTED_NAME" "$EXPECTED_VERSION" 5
          pnpm license:inventory release

          (
            cd "$RUNNER_TEMP/consumer"
            npm install "$GITHUB_WORKSPACE/release/$RELEASE_TARBALL" \
              --ignore-scripts --no-audit --no-fund
            node --input-type=module -e \
              "const pkg = await import('$EXPECTED_NAME'); if (typeof pkg.SafeExecutor !== 'function') throw new Error('PACKED_EXPORT_MISSING')"
          )
      # The runtime: the executables and packages the distribution job built
      # and smoke-tested on every platform, the npm tarball of the runtime
      # package, and a CycloneDX SBOM of what the executable and the image
      # carry, from the runtime's own production dependency tree.
      - name: Download the runtime artifacts
        if: steps.release.outputs.exists != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: runtime-*
          path: release
          merge-multiple: true
      - name: Pack the runtime package and build its SBOM
        if: steps.release.outputs.exists != 'true'
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_version="$(node -p "require('./packages/agentsafe/package.json').version")"
          runtime_name="$(node -p "require('./packages/agentsafe/package.json').name")"
          test "$runtime_name" = "@decionis/agentsafe"
          for target in linux-x64 linux-arm64 darwin-arm64 darwin-x64; do
            test -s "release/agentsafe-$runtime_version-$target.tar.gz"
          done
          test -s release/agentsafe_"$runtime_version"_amd64.deb
          test -s release/agentsafe_"$runtime_version"_arm64.deb
          ls release/agentsafe-"$runtime_version"-*.rpm >/dev/null
          pnpm --filter @decionis/agentsafe build
          (
            cd packages/agentsafe
            pnpm pack --pack-destination "$GITHUB_WORKSPACE/release"
          )
          test -s "release/decionis-agentsafe-$runtime_version.tgz"
          pnpm deploy --filter @decionis/agentsafe --prod "$RUNNER_TEMP/runtime-deploy"
          (
            cd "$RUNNER_TEMP/runtime-deploy"
            npm sbom --omit dev --sbom-format cyclonedx --sbom-type application \
              > "$GITHUB_WORKSPACE/release/agentsafe-$runtime_version.cdx.json"
          )
          node scripts/AssertReleaseSbom.mjs \
            "release/agentsafe-$runtime_version.cdx.json" "$runtime_name" "$runtime_version" 5
          sh -n packaging/install.sh
          cp packaging/install.sh release/install.sh
          {
            echo "version=$runtime_version"
            echo "tarball=decionis-agentsafe-$runtime_version.tgz"
          } >> "$GITHUB_OUTPUT"
      - name: Package the Helm chart
        if: steps.release.outputs.exists != 'true'
        id: chart
        env:
          RUNTIME_VERSION: ${{ steps.runtime.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(node -p "require('yaml').parse(require('fs').readFileSync('charts/agentsafe/Chart.yaml','utf8')).appVersion")"
          chart_version="$(node -p "require('yaml').parse(require('fs').readFileSync('charts/agentsafe/Chart.yaml','utf8')).version")"
          if [[ "$app_version" != "$RUNTIME_VERSION" ]]; then
            echo "charts/agentsafe/Chart.yaml appVersion $app_version is not the runtime version $RUNTIME_VERSION." >&2
            exit 1
          fi
          helm lint charts/agentsafe --set decionis.tenantId=00000000-0000-4000-8000-000000000001 --set upstream.service=payments
          helm package charts/agentsafe --destination release
          test -s "release/agentsafe-$chart_version.tgz"
          echo "version=$chart_version" >> "$GITHUB_OUTPUT"
      - name: Attest package provenance
        if: steps.release.outputs.exists != 'true'
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/${{ steps.release.outputs.tarball }}
      - name: Attest package SBOM
        if: steps.release.outputs.exists != 'true'
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/${{ steps.release.outputs.tarball }}
          sbom-path: release/${{ steps.release.outputs.stem }}.cdx.json
      - name: Attest runtime provenance
        if: steps.release.outputs.exists != 'true'
        id: runtime_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/agentsafe-*.tar.gz
            release/agentsafe_*.deb
            release/agentsafe-*.rpm
            release/decionis-agentsafe-*.tgz
            release/agentsafe-${{ steps.chart.outputs.version }}.tgz
      - name: Set up QEMU
        if: steps.release.outputs.exists != 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        if: steps.release.outputs.exists != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the runtime image
        if: steps.release.outputs.exists != 'true'
        id: image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/agentsafe
          RELEASE_STEM: ${{ steps.release.outputs.stem }}
          # The image is the runtime, and carries the runtime's version.
          RELEASE_VERSION: ${{ steps.runtime.outputs.version }}
          PUBLISH: ${{ github.event_name == 'push' && 'true' || 'false' }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          image="$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          labels=(--label "org.opencontainers.image.version=$RELEASE_VERSION"
            --label "org.opencontainers.image.revision=$GITHUB_SHA")
          # The tags: the exact version always; for a stable release also the
          # minor, the major and latest, so a deployment pins as tightly as it
          # chooses. Production documentation recommends the exact version.
          tags=(-t "$image:$RELEASE_VERSION")
          if [[ "$RELEASE_VERSION" != *-* ]]; then
            major="${RELEASE_VERSION%%.*}"
            minor="${RELEASE_VERSION%.*}"
            tags+=(-t "$image:$minor" -t "$image:$major" -t "$image:latest")
          fi
          # The runner's own platform first, loaded locally, so the image can
          # be run and refused before anything is pushed.
          docker buildx build -f packages/agentsafe/Dockerfile "${labels[@]}" \
            --platform linux/amd64 --load -t "$image:$RELEASE_VERSION" .
          if output="$(docker run --rm "$image:$RELEASE_VERSION" 2>&1)"; then
            echo "The gateway started with no configuration." >&2
            exit 1
          fi
          grep -q 'REFUSED_TO_START' <<<"$output"

          if [[ "$PUBLISH" != "true" ]]; then
            printf 'image=%s\nversion=%s\npublished=false\n' "$image" "$RELEASE_VERSION" \
              > "release/$RELEASE_STEM.image.txt"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
          # Both architectures as one manifest list, with BuildKit's own SBOM
          # and provenance attestations attached to it.
          docker buildx build -f packages/agentsafe/Dockerfile "${labels[@]}" \
            --platform linux/amd64,linux/arm64 --sbom=true --provenance=mode=max \
            "${tags[@]}" --push .
          digest="$(docker buildx imagetools inspect "$image:$RELEASE_VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'image=%s\nversion=%s\ndigest=%s\npublished=true\n' \
            "$image" "$RELEASE_VERSION" "$digest" > "release/$RELEASE_STEM.image.txt"
          {
            echo "published=true"
            echo "name=$image"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"
      - name: Attest the runtime image
        if: steps.release.outputs.exists != 'true' && steps.image.outputs.published == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Verify the published image attestation
        if: steps.release.outputs.exists != 'true' && steps.image.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REFERENCE: ${{ steps.image.outputs.name }}@${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify "oci://$IMAGE_REFERENCE" --repo "$GITHUB_REPOSITORY"
      - name: Push the Helm chart
        if: steps.release.outputs.exists != 'true' && steps.image.outputs.published == 'true'
        env:
          CHART_VERSION: ${{ steps.chart.outputs.version }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          owner="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GHCR_ACTOR" --password-stdin
          helm push "release/agentsafe-$CHART_VERSION.tgz" "oci://ghcr.io/$owner/charts"
      - name: Prepare offline attestation assets
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          RELEASE_STEM: ${{ steps.release.outputs.stem }}
          RELEASE_TARBALL: ${{ steps.release.outputs.tarball }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$PROVENANCE_BUNDLE" "release/$RELEASE_STEM.provenance.sigstore.json"
          cp "$SBOM_BUNDLE" "release/$RELEASE_STEM.sbom.sigstore.json"
          node scripts/ExtractAttestationStatement.mjs \
            "release/$RELEASE_STEM.provenance.sigstore.json" \
            "release/$RELEASE_STEM.provenance.intoto.json" \
            "release/$RELEASE_TARBALL"
          node scripts/ExtractAttestationStatement.mjs \
            "release/$RELEASE_STEM.sbom.sigstore.json" \
            "release/$RELEASE_STEM.sbom.intoto.json" \
            "release/$RELEASE_TARBALL"
          gh attestation trusted-root > release/trusted_root.jsonl
          gh attestation verify "release/$RELEASE_TARBALL" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "release/$RELEASE_STEM.provenance.sigstore.json" \
            --custom-trusted-root release/trusted_root.jsonl

          checksum_file="$RUNNER_TEMP/SHA256SUMS"
          (
            cd release
            for file in $(find . -maxdepth 1 -type f ! -name SHA256SUMS -print | sort); do
              sha256sum "${file#./}"
            done > "$checksum_file"
            test "$(wc -l < "$checksum_file")" -ge 9
          )
          mv "$checksum_file" release/SHA256SUMS
      # The Homebrew formula, from the same SHA256SUMS the installer verifies
      # against: nothing in it is typed by hand.
      - name: Render the Homebrew formula
        if: steps.release.outputs.exists != 'true'
        env:
          RUNTIME_VERSION: ${{ steps.runtime.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/RenderHomebrewFormula.mjs --version "$RUNTIME_VERSION" \
            --sums release/SHA256SUMS --out release/agentsafe.rb
          ruby -c release/agentsafe.rb
      - name: Publish the runtime package to npm through trusted publishing
        if: >-
          steps.release.outputs.exists != 'true' &&
          github.event_name == 'push' &&
          vars.NPM_PUBLISH_RUNTIME_ENABLED == 'true'
        env:
          NPM_PACKAGE: "@decionis/agentsafe"
          RELEASE_TARBALL: ${{ steps.runtime.outputs.tarball }}
          RELEASE_VERSION: ${{ steps.runtime.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          published_version="$(npm view "$NPM_PACKAGE@$RELEASE_VERSION" version 2>/dev/null || true)"
          if [[ "$published_version" == "$RELEASE_VERSION" ]]; then
            echo "$NPM_PACKAGE@$RELEASE_VERSION is already public; skipping publication."
          else
            publish_args=("./release/$RELEASE_TARBALL" --access public)
            if [[ "$RELEASE_VERSION" == *-* ]]; then
              publish_args+=(--tag next)
            fi
            npm publish "${publish_args[@]}"
          fi
      - name: Publish package to npm through trusted publishing
        if: >-
          steps.release.outputs.exists != 'true' &&
          github.event_name == 'push' &&
          vars.NPM_PUBLISH_ENABLED == 'true'
        env:
          NPM_PACKAGE: ${{ steps.release.outputs.package }}
          RELEASE_TARBALL: ${{ steps.release.outputs.tarball }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          published_version="$(npm view "$NPM_PACKAGE@$RELEASE_VERSION" version 2>/dev/null || true)"
          if [[ "$published_version" == "$RELEASE_VERSION" ]]; then
            echo "$NPM_PACKAGE@$RELEASE_VERSION is already public; skipping publication."
          else
            publish_args=("./release/$RELEASE_TARBALL" --access public)
            if [[ "$RELEASE_VERSION" == *-* ]]; then
              publish_args+=(--tag next)
            fi
            npm publish "${publish_args[@]}"

            for attempt in {1..36}; do
              published_version="$(npm view "$NPM_PACKAGE@$RELEASE_VERSION" version 2>/dev/null || true)"
              if [[ "$published_version" == "$RELEASE_VERSION" ]]; then
                echo "$NPM_PACKAGE@$RELEASE_VERSION became public after $attempt verification attempt(s)."
                break
              fi
              if (( attempt == 36 )); then
                echo "$NPM_PACKAGE@$RELEASE_VERSION did not become public within 180 seconds." >&2
                exit 1
              fi
              sleep 5
            done
          fi
      - name: Create verified GitHub release
        if: steps.release.outputs.exists != 'true' && github.event_name == 'push'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
          NPM_PACKAGE: ${{ steps.release.outputs.package }}
          RELEASE_STEM: ${{ steps.release.outputs.stem }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TARBALL: ${{ steps.release.outputs.tarball }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          IMAGE_PUBLISHED: ${{ steps.image.outputs.published }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_VERSION: ${{ steps.runtime.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git push origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"

          npm_url="https://www.npmjs.com/package/$NPM_PACKAGE/v/$RELEASE_VERSION"
          if [[ "$NPM_PUBLISH_ENABLED" == "true" ]]; then
            npm_note="npm: [$NPM_PACKAGE@$RELEASE_VERSION]($npm_url)"
          else
            npm_note="npm publication was not enabled for this release."
          fi
          if [[ "$IMAGE_PUBLISHED" == "true" ]]; then
            image_note="Container image: \`$IMAGE_NAME:$IMAGE_VERSION\` at \`$IMAGE_DIGEST\`, attested by this workflow. Verify with \`gh attestation verify oci://$IMAGE_NAME@$IMAGE_DIGEST --repo $GITHUB_REPOSITORY\`."
          else
            image_note="The runtime image was built and checked for this release but not published."
          fi
          {
            echo "## Install the runtime"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/$GH_REPO/$RELEASE_TAG/packaging/install.sh | sh"
            echo "brew tap decionis/agent-safe https://github.com/$GH_REPO && brew install agentsafe"
            echo '```'
            echo
            echo "The \`agentsafe-<version>-<os>-<arch>.tar.gz\` archives, the \`.deb\` and \`.rpm\` packages, the npm tarball of \`@decionis/agentsafe\` and the Helm chart \`agentsafe-<chart version>.tgz\` (also at \`oci://ghcr.io/decionis/charts/agentsafe\`) are attached, listed in \`SHA256SUMS\`, and attested by this workflow; \`agentsafe-<version>.cdx.json\` is the runtime's CycloneDX SBOM. The Homebrew formula for this release is opened as a pull request from the \`homebrew/agentsafe-<version>\` branch."
            echo
            echo "## Verifiable artifacts"
            echo
            echo "$npm_note"
            echo
            echo "$image_note"
            echo
            echo '```sh'
            echo "shasum -a 256 -c SHA256SUMS"
            echo "gh attestation verify $RELEASE_TARBALL \\"
            echo "  --repo $GITHUB_REPOSITORY \\"
            echo "  --bundle $RELEASE_STEM.provenance.sigstore.json \\"
            echo "  --custom-trusted-root trusted_root.jsonl"
            echo '```'
            echo
            echo "The annotated release tag is keylessly signed by the protected deploy workflow. See [release tag signing](https://github.com/decionis/agent-safe-pipeline/blob/master/docs/release-tag-signing.md) for identity-bound verification commands."
            echo
            echo "The CycloneDX SBOM was generated from the extracted npm tarball and contains at least five dependency components. Raw in-toto statements and their signed Sigstore bundles are attached for mirrors and offline verification."
          } > "$RUNNER_TEMP/release-notes.md"

          release_args=(
            "$RELEASE_TAG"
            release/*
            --verify-tag
            --title "$RELEASE_TAG"
            --generate-notes
            --notes-file "$RUNNER_TEMP/release-notes.md"
          )
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
      # The tap is this repository: the rendered formula goes to a branch of
      # its own, and the pull request bot opens the change for review the way
      # it opens every other branch. Nothing is pushed to master by a workflow.
      - name: Open the Homebrew formula for review
        if: steps.release.outputs.exists != 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_VERSION: ${{ steps.runtime.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          branch="homebrew/agentsafe-$RUNTIME_VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "$branch exists; nothing to open."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch" "$GITHUB_SHA"
          cp release/agentsafe.rb Formula/agentsafe.rb
          git add Formula/agentsafe.rb
          git commit -s -m "dist(homebrew): pin the agentsafe formula to $RELEASE_TAG" \
            -m "Rendered by the release workflow from the release's SHA256SUMS."
          git push origin "$branch"
      - name: Upload verified dry-run assets
        if: steps.release.outputs.exists != 'true' && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dry-run-${{ steps.release.outputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 7
