title = "Agent-Safe Pipeline secret scanning configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Documented synthetic idempotency fixtures; these exact values have never been credentials"
regexTarget = "secret"
regexes = [
  '''^refund-synthetic-1001-v1$''',
  '''^refund-58291-v1$''',
  '''^refund-58291-v2$''',
]

# The BEAP profile mirrored under profiles/beap/v<version> carries the specification's
# worked examples. Their request identifier doubles as the intent-bound
# idempotency key, and the generic-api-key detector reads the `idempotency_key`
# field name as a credential keyword. These two values are fixtures recorded in
# the source repository's provenance manifest, never credentials. Exact values
# only: not a path exemption, and not a rule-wide one.
[[allowlists]]
description = "Synthetic request identifiers in the archived BEAP specification examples"
regexTarget = "secret"
regexes = [
  '''^synthetic-req-0001$''',
  '''^synthetic-req-0002$''',
]

# The Verifying Provider Profile vectors under conformance/provider/vectors carry
# claim attestations: compact JWS values the profile requires a provider to
# verify, which the jwt detector reads as tokens. They are signed by a key
# generated for the vectors and discarded, and an attestation is a bearer for
# nothing by design: it carries a digest of the claim token, never the token.
# The exemption is the narrowest the values allow: a JWS whose protected
# header, the same base64 in every regeneration, opens with
# {"alg":"EdDSA","kid":"vector-execution-grant-1", the vectors' own key. A JWS
# under any other header, one the authority's live keys signed included, is
# still reported wherever it appears.
[[allowlists]]
description = "Claim attestations signed with the conformance vectors' own key"
regexTarget = "secret"
regexes = [
  '''^eyJhbGciOiJFZERTQSIsImtpZCI6InZlY3Rvci1leGVjdXRpb24tZ3JhbnQtMSI[A-Za-z0-9_-]*\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$''',
]

# The receipt vectors under conformance/provider/receipts carry effect receipts
# the same way: compact JWS values signed by a key generated for the vectors and
# discarded, under the protected header {"alg":"EdDSA","kid":"vector-provider-receipts-1".
# A receipt is the provider's statement of what it did, verifiable by anyone
# holding the public half the vector itself carries, and a bearer for nothing.
[[allowlists]]
description = "Effect receipts signed with the receipt vectors' own key"
regexTarget = "secret"
regexes = [
  '''^eyJhbGciOiJFZERTQSIsImtpZCI6InZlY3Rvci1wcm92aWRlci1yZWNlaXB0cy0xI[A-Za-z0-9_-]*\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$''',
]
