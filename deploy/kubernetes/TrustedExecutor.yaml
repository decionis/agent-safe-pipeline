# The trusted executor, deployed inside the adopter's own boundary.
#
# Nothing here carries a value that belongs to a deployment. IMAGE_PLACEHOLDER
# is the executor image in your registry (packages/agentsafe/Dockerfile);
# every host is `.example`; every credential is a Secret you create and this
# manifest only references. There is no `kind: Secret` here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-safe-executor-config
  namespace: agent-safe
data:
  # SHADOW first. Changing this to ENFORCEMENT is a decision a person makes
  # after the runbook's stopping criteria are met (deploy/Runbook.md).
  EXECUTOR_MODE: "SHADOW"
  EXECUTOR_BIND_ADDRESS: "0.0.0.0"
  PORT: "8443"
  EXECUTOR_TENANT_ID: "00000000-0000-4000-8000-000000000001"
  EXECUTOR_ACTOR_ID: "synthetic-payout-agent"
  EXECUTOR_ACTOR_TYPE: "AI_AGENT"
  EXECUTOR_ACTOR_RUNTIME: "workflow-runner"
  # A proposal stays valid this long; a ceremony has to finish inside it.
  EXECUTOR_INTENT_TTL_SECONDS: "300"
  # EXECUTOR_POSTURE is deliberately not set: it defaults to ENFORCED, and
  # the process refuses to start on a host that does not hold the posture
  # this manifest declares. Every secret is a file under this directory,
  # owned by root and readable by the pod's fsGroup only; the TLS key is
  # one of them, mounted from its own Secret beside the others.
  EXECUTOR_SECRETS_DIR: "/var/run/agent-safe"
  # The listener is TLS 1.3. The certificate and key come from a Secret of
  # type kubernetes.io/tls (tls.crt, tls.key) that you create; the probes
  # below speak HTTPS and present no client certificate, which the public
  # routes admit. To require client certificates on every other route, add
  # EXECUTOR_TLS_CLIENT_CA_FILE pointing at a mounted CA bundle.
  EXECUTOR_TLS_CERT_FILE: "/var/run/agent-safe/tls/tls.crt"
  EXECUTOR_TLS_KEY_FILE: "/var/run/agent-safe/tls/tls.key"
  # Two things live here. Under chain/ are the evidence chains' heads, so a
  # restart continues the sequence. Under attempts/ is the attempt journal:
  # every execution is written there before the provider is touched, and a
  # restart reconciles what it finds read-only. The volume is a per-replica
  # claim below, because an attempt has to outlive the container that made
  # it. The journal carries the request's own parameters, so protect it as
  # you protect the traffic.
  EXECUTOR_JOURNAL_DIR: "/var/lib/agent-safe/journal"
  # Stay out of the load balancer while any attempt's outcome is unknown, so
  # a replica that cannot say what it did takes no new work.
  EXECUTOR_READY_REQUIRES_NO_UNKNOWN_ATTEMPTS: "true"
  # The stop. Create the file in the ConfigMap below and every replica halts
  # within seconds; remove it and an operator may resume with a reason.
  EXECUTOR_HALT_FILE: "/var/run/agent-safe/halt/halted"
  # A flood of refused credentials, or of refused outbound requests, halts the
  # executor. Both are reachable from the agent zone on purpose: stopping is
  # the fail-closed answer to a caller behaving like a compromised one.
  EXECUTOR_HALT_ON_AUTH_FAILURES: "50/60"
  EXECUTOR_HALT_ON_EGRESS_REFUSALS: "5/60"
  # The host's own ceilings, above whatever policy decides. They only ever
  # refuse, the window is per replica and per process, and an unlisted
  # currency is refused outright.
  EXECUTOR_HARD_LIMIT_SINGLE_MINOR: "CHF:2500000000,EUR:1000000000"
  EXECUTOR_HARD_LIMIT_WINDOW_SECONDS: "60"
  EXECUTOR_HARD_LIMIT_WINDOW_COUNT: "120"
  # How far this host's clock may be from the authority's before it halts.
  EXECUTOR_MAX_CLOCK_SKEW_MS: "2000"
  # NONE returns the hold. MANAGED has the authority orchestrate Presence and
  # needs PRESENCE_APPROVER_ID, PRESENCE_VERIFICATION_LEVEL and
  # PRESENCE_VERIFICATION_METHODS (PRESENCE_APPROVER_ROLE optional). DIRECT
  # has this process open the Presence request and additionally needs
  # PRESENCE_API_URL, PRESENCE_API_KEY_FILE, PRESENCE_ORGANIZATION,
  # PRESENCE_HARDWARE_PKI_REQUIRED and PRESENCE_DISALLOW_VIRTUAL_CAMERAS.
  # Who may call, and as what. The ConfigMap below holds digests and
  # identities only: a bearer credential is the SHA-256 of a token the caller
  # holds, a certificate is named by its SAN URI, a workload token by its
  # issuer and subject. EXECUTOR_TENANT_ID and EXECUTOR_ACTOR_* are absent
  # deliberately: each principal carries its own.
  EXECUTOR_PRINCIPALS_FILE: "/var/run/agent-safe/principals/principals.json"
  # Workload tokens are verified against the cluster's own signing keys. Fill
  # the ConfigMap below from `kubectl get --raw /openid/v1/jwks`, and set
  # EXECUTOR_JWKS_URL if you would rather the executor refresh it itself (it
  # then needs the API server's range in the egress policy below).
  EXECUTOR_JWT_AUDIENCE: "agentsafe"
  EXECUTOR_JWKS_FILE: "/var/run/agent-safe/jwks/jwks.json"
  # Attempts that never became a principal share one window; a principal whose
  # proven identity keeps failing is locked out for five minutes.
  EXECUTOR_RATE_LIMIT_UNAUTHENTICATED: "20/60"
  EXECUTOR_AUTH_LOCKOUT: "10/60/300"
  EXECUTOR_ESCALATION: "MANAGED"
  PRESENCE_APPROVER_ID: "synthetic-treasury-approver"
  PRESENCE_APPROVER_ROLE: "CRO"
  PRESENCE_VERIFICATION_LEVEL: "HIGH_CONFIDENCE"
  PRESENCE_VERIFICATION_METHODS: "WEBAUTHN,ACTIVE_LIVENESS"
  DECIONIS_API_URL: "https://authority.decionis.example"
  DECIONIS_API_KEY_FILE: "/var/run/agent-safe/secrets/decionis-api-key"
  DOWNSTREAM_URL: "https://payouts.provider.example/v1/payouts"
  DOWNSTREAM_LOOKUP_URL: "https://payouts.provider.example/v1/payouts/{idempotency_key}"
  DOWNSTREAM_SYSTEM: "payout-rail"
  DOWNSTREAM_OPERATION: "create_payout"
  DOWNSTREAM_ENVIRONMENT: "production"
  # STATIC_HEADER is the simplest kind. PRIVATE_KEY_JWT (an OAuth 2.0 client
  # assertion to DOWNSTREAM_TOKEN_URL) and SIGNED_REQUEST (an RFC 9421
  # signature per request) are the other two; each names its own secret and
  # forbids the others' keys.
  DOWNSTREAM_CREDENTIAL_KIND: "STATIC_HEADER"
  DOWNSTREAM_CREDENTIAL_FILE: "/var/run/agent-safe/secrets/downstream-credential"
  DOWNSTREAM_CREDENTIAL_HEADER: "Authorization"
  DOWNSTREAM_TIMEOUT_MS: "5000"
---
# Who may call. Digests and identities only; no token, key or certificate is
# in this file. One principal per workload: a PROPOSER carries the tenant and
# actor its intents name and the actions it may propose, an OPERATOR carries
# the control scopes it may use. The executor refuses to load a file that
# names an action nobody registered, a credential two principals share, or a
# workload credential without the JWKS below.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-safe-executor-principals
  namespace: agent-safe
data:
  principals.json: |
    {
      "version": "agent-safe.principals/1",
      "principals": [
        {
          "id": "treasury-workflow",
          "role": "PROPOSER",
          "tenant_id": "00000000-0000-4000-8000-000000000001",
          "actor": {
            "id": "synthetic-payout-agent",
            "type": "AI_AGENT",
            "runtime": "workflow-runner"
          },
          "allowed_actions": ["forward_request"],
          "credential": {
            "kind": "WORKLOAD_JWT",
            "issuer": "https://kubernetes.default.svc.cluster.example",
            "subject": "system:serviceaccount:agent-safe-agents:treasury-workflow",
            "required_claims": { "kubernetes.io/namespace": "agent-safe-agents" }
          },
          "rate_limit": "120/60"
        },
        {
          "id": "ops-oncall",
          "role": "OPERATOR",
          "scopes": ["status", "metrics", "secrets.reload"],
          "credential": {
            "kind": "MTLS",
            "san_uri": "spiffe://cluster.example/ns/agent-safe-ops/sa/oncall"
          }
        }
      ]
    }
---
# The cluster's own token-signing keys, so a projected service-account token
# proves the caller. Populate from `kubectl get --raw /openid/v1/jwks`; it is
# public key material and belongs in a ConfigMap, not a Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-safe-executor-jwks
  namespace: agent-safe
data:
  jwks.json: |
    { "keys": [] }
---
# A StatefulSet, not a Deployment, because the attempt journal is per
# replica: a pod that restarts must come back to its own journal and
# reconcile what it left open. Each replica gets its own claim below.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agent-safe-executor
  namespace: agent-safe
  labels:
    app: agent-safe-executor
spec:
  serviceName: agent-safe-executor
  # Two replicas so a rolling restart leaves one taking work; each keeps its
  # own journal and its own limit windows, which is why the ceilings are a
  # backstop against a policy mistake and not a treasury control.
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: agent-safe-executor
  template:
    metadata:
      labels:
        app: agent-safe-executor
    spec:
      automountServiceAccountToken: false
      # The image runs as distroless `nonroot` (65532). The fsGroup makes the
      # Secret volume readable by the process's group, which is one of the two
      # ownership shapes the executor's posture accepts.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: executor
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8443
              protocol: TCP
          envFrom:
            - configMapRef:
                name: agent-safe-executor-config
          volumeMounts:
            - name: secrets
              mountPath: /var/run/agent-safe/secrets
              readOnly: true
            - name: tls
              mountPath: /var/run/agent-safe/tls
              readOnly: true
            - name: principals
              mountPath: /var/run/agent-safe/principals
              readOnly: true
            - name: jwks
              mountPath: /var/run/agent-safe/jwks
              readOnly: true
            - name: halt
              mountPath: /var/run/agent-safe/halt
              readOnly: true
            - name: journal
              mountPath: /var/lib/agent-safe
          readinessProbe:
            httpGet:
              path: /ready
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: secrets
          secret:
            # Created out of band with the keys the ConfigMap names:
            # caller-token, decionis-api-key, downstream-credential, and
            # presence-api-key only for DIRECT escalation. Never checked in
            # anywhere. The mode is 0440 written as a decimal, because this
            # file is read as YAML 1.2 by the repository's tooling: the files
            # are root-owned, readable by the fsGroup, and by nobody else,
            # which the executor verifies before it reads them.
            secretName: agent-safe-executor-secrets
            defaultMode: 288
        - name: tls
          secret:
            # A kubernetes.io/tls Secret you create: tls.crt and tls.key for
            # the name the callers connect to. Same ownership shape as above.
            secretName: agent-safe-executor-tls
            defaultMode: 288
        - name: principals
          configMap:
            name: agent-safe-executor-principals
            defaultMode: 288
        - name: jwks
          configMap:
            name: agent-safe-executor-jwks
            defaultMode: 288
        - name: halt
          configMap:
            name: agent-safe-executor-halt
            defaultMode: 288
            optional: true
  # One claim per replica. ReadWriteOnce is right: the journal belongs to the
  # pod that wrote it, and no other replica may read or write it.
  volumeClaimTemplates:
    - metadata:
        name: journal
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
# The stop, as data. Create this ConfigMap with any content at all and every
# replica halts within seconds; delete it and an operator may resume with a
# reason. The executor refuses to resume while the file is still there.
#
#   kubectl -n agent-safe create configmap agent-safe-executor-halt \
#     --from-literal=halted="payment rail incident, on-call stopped it"
#
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-safe-executor
  namespace: agent-safe
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: agent-safe-executor
#
# The proposing workflow, in the agent zone, presents a projected
# service-account token whose audience is the executor's. Nothing here needs a
# shared secret: the cluster signs the token, the executor verifies it against
# the JWKS above, and the principals file says which subject may propose what.
#
#   spec:
#     serviceAccountName: treasury-workflow
#     containers:
#       - name: workflow
#         volumeMounts:
#           - name: executor-token
#             mountPath: /var/run/secrets/agent-safe
#             readOnly: true
#     volumes:
#       - name: executor-token
#         projected:
#           sources:
#             - serviceAccountToken:
#                 path: token
#                 audience: agentsafe
#                 expirationSeconds: 600
#
---
apiVersion: v1
kind: Service
metadata:
  name: agent-safe-executor
  namespace: agent-safe
spec:
  type: ClusterIP
  selector:
    app: agent-safe-executor
  ports:
    - port: 8443
      targetPort: 8443
      protocol: TCP
---
# Only the workflow that proposes may reach the executor, and the executor
# may reach only the authority and the downstream. The agent runtime has no
# path to the downstream at all (THREAT-MODEL.md, "Accepted risks").
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-safe-executor
  namespace: agent-safe
spec:
  podSelector:
    matchLabels:
      app: agent-safe-executor
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              agent-safe-caller: "true"
      ports:
        - port: 8443
          protocol: TCP
  egress:
    # DNS.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
    # The authority and the downstream: fill in the ranges your network
    # gives them.
    - to:
        - ipBlock:
            cidr: AUTHORITY_CIDR_PLACEHOLDER
      ports:
        - port: 443
          protocol: TCP
    - to:
        - ipBlock:
            cidr: DOWNSTREAM_CIDR_PLACEHOLDER
      ports:
        - port: 443
          protocol: TCP
